# Native component syllables, compiled separately from literal lookup.
schema:
  schema_id: project_radical_parts
  name: Component prefix lookup
  version: '2026.10.15.1'
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - xform/([ei])ng$/$1n/
    - abbrev/^([a-z]{1})[a-z]+$/$1/
    - abbrev/^([a-z]{2})[a-z]+$/$1/
    - abbrev/^([a-z]{3})[a-z]+$/$1/
    - abbrev/^([a-z]{4})[a-z]+$/$1/
    - abbrev/^([a-z]{5})[a-z]+$/$1/
translator:
  dictionary: project_radical_parts
  prism: project_radical_parts
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
  enable_word_completion: false
  enable_correction: false
  contextual_suggestions: false
  # script_translator limits its sentence graph with max_homophones.
  max_homophones: 0
  spelling_hints: 99
  always_show_comments: true
