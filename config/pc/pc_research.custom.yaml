# Public PC baseline: matching patched Weasel and librime-lua builds are required.
patch:
  menu/page_size: 5
  menu/chinese_page_size: 5
  menu/english_page_size: 6
  style/mode_layout:
    option: research_english
    off:
      horizontal: true
      candidate_spacing: 16
      comment_font_point: 12
    on:
      horizontal: false
      candidate_spacing: 4
      comment_font_point: 14
  switches:
    - { name: ascii_mode, reset: 0 }
    - { name: full_shape, reset: 0 }
    - { name: simplification, reset: 1, states: [漢字, 汉字] }
    - { name: ascii_punct, reset: 1 }
    - { name: research_english, reset: 0, states: [中文, 智能英文] }
    # Last reset is a private initialization-complete notification.
    - { name: probe_options_ready, reset: 1 }
  speller/alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  speller/initials: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  speller/delimiter: " '"
  speller/algebra:
    - xform/([ei])ng$/$1n/
    - erase/^xx$/
    - xform/^(a|ai|an|ang|ao|ba|bai|ban|bang|bao|bei|ben|bi|bian|biang|biao|bie|bin|bo|bu|ca|cai|can|cang|cao|ce|cei|cen|cha|chai|chan|chang|chao|che|chen|chi|chong|chou|chu|chua|chuai|chuan|chuang|chui|chun|chuo|ci|cong|cou|cu|cuan|cui|cun|cuo|da|dai|dan|dang|dao|de|dei|den|di|dia|dian|diao|die|din|diu|dong|dou|du|duan|dui|dun|duo|e|eh|ei|en|er|fa|fan|fang|fei|fen|fiao|fo|fong|fou|fu|ga|gai|gan|gang|gao|ge|gei|gen|gong|gou|gu|gua|guai|guan|guang|gui|gun|guo|ha|hai|han|hang|hao|he|hei|hen|hong|hou|hu|hua|huai|huan|huang|hui|hun|huo|ji|jia|jian|jiang|jiao|jie|jin|jiong|jiu|ju|juan|jue|jun|ka|kai|kan|kang|kao|ke|kei|ken|kong|kou|ku|kua|kuai|kuan|kuang|kui|kun|kuo|la|lai|lan|lang|lao|le|lei|len|li|lia|lian|liang|liao|lie|lin|liu|lo|long|lou|lu|luan|lun|luo|lv|lvan|lve|ma|mai|man|mang|mao|me|mei|men|mi|mian|miao|mie|min|miu|mo|mou|mu|na|nai|nan|nang|nao|ne|nei|nen|ni|nia|nian|niang|niao|nie|nin|niu|nong|nou|nu|nuan|nun|nuo|nv|nve|o|ou|pa|pai|pan|pang|pao|pei|pen|pi|pia|pian|piao|pie|pin|po|pou|pu|qi|qia|qian|qiang|qiao|qie|qin|qiong|qiu|qu|quan|que|qun|ran|rang|rao|re|ren|ri|rong|rou|ru|rua|ruan|rui|run|ruo|sa|sai|san|sang|sao|se|sei|sen|sha|shai|shan|shang|shao|she|shei|shen|shi|shou|shu|shua|shuai|shuan|shuang|shui|shun|shuo|si|song|sou|su|suan|sui|sun|suo|ta|tai|tan|tang|tao|te|tei|ten|ti|tian|tiao|tie|tin|tong|tou|tu|tuan|tui|tun|tuo|wa|wai|wan|wang|wei|wen|wo|wong|wu|xi|xia|xian|xiang|xiao|xie|xin|xiong|xiu|xu|xuan|xue|xun|ya|yai|yan|yang|yao|ye|yi|yin|yo|yong|you|yu|yuan|yue|yun|za|zai|zan|zang|zao|ze|zei|zen|zha|zhai|zhan|zhang|zhao|zhe|zhei|zhen|zhi|zhong|zhou|zhu|zhua|zhuai|zhuan|zhuang|zhui|zhun|zhuo|zi|zong|zou|zu|zuan|zui|zun|zuo)$/~$1~/
