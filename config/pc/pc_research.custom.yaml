  translator/dictionary: luna_pinyin.research
  engine/processors:
    - lua_processor@probe_global_mode
    - lua_processor@draft_limit
    - lua_processor@en_processor
    - lua_processor@query_info_submit
    - lua_processor@tool_processor
    - lua_processor@candidate_keys
    - lua_processor@select_hanzi
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  engine/translators:
    - punct_translator
    - lua_translator@cn_translator
    - lua_translator@u_translator
    - lua_translator@tool_translator
  engine/filters:
    - lua_filter@research_mode_filter
    - simplifier
    - uniquifier
    - lua_filter@candidate_comment_filter
  ascii_composer/switch_key:
    Shift_L: noop
    Shift_R: inline_ascii
    Caps_Lock: clear
    Eisu_toggle: clear
    Control_L: noop
    Control_R: noop
  # Keep the default uppercase recognizer from consuming candidate numbers.
  recognizer/patterns/uppercase: '^$'
  recognizer/patterns/reverse_lookup: "^uU[a-z]*U?'?$"
  key_binder/bindings:
    - { when: has_menu, accept: Shift+Delete, send: Control+Delete }
    - { when: always, accept: Control+Shift+f, toggle: simplification }
    - { when: always, accept: Control+Shift+F, toggle: simplification }
  research_greek:
    dictionary: research_greek
    enable_completion: true
    enable_sentence: false
    enable_user_dict: true
    initial_quality: 0
  probe/unified_memory: true
  translator/user_dict: luna_pinyin

  cn_decoder:
    dictionary: luna_pinyin.research
    prism: luna_pinyin.research
    enable_user_dict: false
  translator/enable_completion: false
  translator/enable_word_completion: true
  probe/greek_code_prefix: "~g~"

  schema/dependencies: [stroke, project_radical, project_radical_parts, english_full, mixed_full]
  engine/segmentors:
    - lua_segmentor@en_segmentor
    - lua_segmentor@tool_segmentor
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  english_native:
    dictionary: english_full
    prism: english_full
    user_dict: pc_english
    tag: abc
    delimiter: " "
    enable_user_dict: true
    enable_sentence: false
    enable_completion: true
    sentence_over_completion: false
    contextual_suggestions: false
    enable_encoder: false
    encode_commit_history: false
    initial_quality: 0

  research_stroke:
    dictionary: stroke
    prism: stroke
    tag: u_lookup
    enable_user_dict: false
    enable_encoder: false
    encode_commit_history: false
    enable_sentence: false
    enable_completion: true
    sentence_over_completion: false
    contextual_suggestions: false
    initial_quality: 0
  research_radical:
    dictionary: project_radical
    prism: project_radical
    tag: u_lookup
    enable_user_dict: false
    enable_encoder: false
    encode_commit_history: false
    enable_sentence: false
    enable_completion: true
    sentence_over_completion: false
    contextual_suggestions: false
    initial_quality: 0

  research_radical_parts:
    dictionary: project_radical_parts
    prism: project_radical_parts
    tag: u_lookup
    delimiter: " '"
    enable_user_dict: false
    enable_encoder: false
    encode_commit_history: false
    enable_sentence: false
    enable_completion: true
    enable_word_completion: false
    enable_correction: false
    contextual_suggestions: false
    # Keep the sentence graph empty; component lookup must return one entry.
    max_homophones: 0
    spelling_hints: 99
    always_show_comments: true
    initial_quality: 0

  simplifier/excluded_types: [tool_unicode, tool_calc, u_stroke, u_stroke_completion, u_radical, u_radical_completion, u_radical_abbreviation, mdx_sc_original]
  simplifier/opencc_config: mdx_t2s.json

  mixed_native:
    dictionary: mixed_full
    prism: mixed_full
    user_dict: pc_mixed
    tag: abc
    delimiter: " "
    enable_user_dict: true
    enable_sentence: false
    enable_completion: false
    contextual_suggestions: false
    enable_encoder: false
    encode_commit_history: false
    initial_quality: 0

  # R06-R08; change here and redeploy. Existing typo paths remain.
  cn_tolerance:
    missing_letter: true
    neighbor_substitution: true
    double_transposition: true

  # BEGIN Luna compact model trial 2026-10-19
  grammar:
    language: zh-hant-t-essay-bgw-compact
    collocation_max_length: 6
    collocation_min_length: 3
    collocation_penalty: -14
