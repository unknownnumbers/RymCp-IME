# RymCp Chinese and smart English for official Weasel.
# SPDX-License-Identifier: GPL-3.0-only
schema:
  schema_id: pc_research
  name: 朙月拓展
  version: '2026.11.14.official-weasel.1'
  dependencies: [english_full]
switches:
  - {name: ascii_mode, reset: 0}
  - {name: full_shape, reset: 0}
  - {name: simplification, reset: 1, states: [漢字, 汉字]}
  - {name: ascii_punct, reset: 1}
  - {name: research_english, reset: 0, states: [中文, 智能英文]}
engine:
  processors:
    - lua_processor@official_backup_mode
    - lua_processor@draft_limit
    - lua_processor@en_processor
    - lua_processor@candidate_keys
    - lua_processor@select_hanzi
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - lua_segmentor@en_segmentor
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@cn_translator
  filters:
    - lua_filter@research_mode_filter
    - simplifier
    - uniquifier
    - lua_filter@candidate_comment_filter
menu:
  page_size: 6
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  initials: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
translator:
  packs: []
  dictionary: luna_pinyin.research
  user_dict: luna_pinyin
  enable_completion: false
  enable_word_completion: false
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
cn_decoder:
  dictionary: luna_pinyin.research
  prism: luna_pinyin.research
  enable_user_dict: false
punctuator:
  import_preset: default
key_binder:
  import_preset: default
  bindings:
    - {when: has_menu, accept: Shift+Delete, send: Control+Delete}
    - {when: always, accept: Control+Shift+f, toggle: simplification}
    - {when: always, accept: Control+Shift+F, toggle: simplification}
recognizer:
  patterns:
    uppercase: '^$'
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: inline_ascii
    Caps_Lock: clear
    Eisu_toggle: clear
    Control_L: noop
    Control_R: noop
simplifier:
  excluded_types: [mdx_sc_original]
  opencc_config: mdx_t2s.json
draft_limits:
  chinese: 48
  english: 64
__patch:
  - rymcp_dlc/math/words.dict:/patch?
  - rymcp_dlc/physics/words.dict:/patch?
  - rymcp_dlc/computer/words.dict:/patch?
  - rymcp_dlc/poetry/words.dict:/patch?
  - pc_research.custom:/patch
